name: Verifier Gate

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-verifier-evidence:
    name: Validate Verifier Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Validate verifier evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          event_path = os.environ["GITHUB_EVENT_PATH"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)

          pull_request = event.get("pull_request") or {}
          pr_number = pull_request.get("number")
          pr_author = ((pull_request.get("user") or {}).get("login") or "")
          head_sha = ((pull_request.get("head") or {}).get("sha") or "")
          pr_body = pull_request.get("body") or ""

          errors = []

          def fail(message):
              errors.append(message)

          def strip_comments(value):
              return re.sub(r"<!--.*?-->", "", value, flags=re.S)

          def exactly_one(pattern, value, field_name):
              matches = re.findall(pattern, value, flags=re.M)
              if len(matches) != 1:
                  fail(
                      f"Expected exactly one valid `{field_name}` field; "
                      f"found {len(matches)}."
                  )
                  return None
              return matches[0]

          if not pr_number:
              fail("Unable to determine pull request number.")

          if not head_sha:
              fail("Unable to determine current pull request head SHA.")

          contract_body = strip_comments(pr_body)

          spec_issue = exactly_one(
              r"^Spec-Issue:\s*#([1-9][0-9]*)\s*$",
              contract_body,
              "Spec-Issue",
          )

          spec_version = exactly_one(
              r"^Spec-Version:\s*(v[1-9][0-9]*)\s*$",
              contract_body,
              "Spec-Version",
          )

          if not errors:
              reviews_url = (
                  f"https://api.github.com/repos/{repository}/pulls/"
                  f"{pr_number}/reviews?per_page=100"
              )

              request = urllib.request.Request(
                  reviews_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "verifier-gate",
                  },
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      reviews = json.load(response)
              except urllib.error.HTTPError as exc:
                  fail(
                      "Unable to read pull request reviews: "
                      f"GitHub API returned HTTP {exc.code}."
                  )
                  reviews = []
              except urllib.error.URLError as exc:
                  fail(
                      "Unable to read pull request reviews: "
                      f"{exc.reason}."
                  )
                  reviews = []

              trusted_associations = {
                  "OWNER",
                  "MEMBER",
                  "COLLABORATOR",
              }

              decision_states = {
                  "APPROVED",
                  "CHANGES_REQUESTED",
                  "DISMISSED",
              }

              latest_decision_by_reviewer = {}

              for review in reviews:
                  reviewer = ((review.get("user") or {}).get("login") or "")
                  state = (review.get("state") or "").upper()

                  if not reviewer or state not in decision_states:
                      continue

                  current = latest_decision_by_reviewer.get(reviewer)

                  review_id = review.get("id") or 0
                  current_id = (current or {}).get("id") or 0

                  if current is None or review_id > current_id:
                      latest_decision_by_reviewer[reviewer] = review

              valid_pass_reviews = []

              for reviewer, review in latest_decision_by_reviewer.items():
                  state = (review.get("state") or "").upper()

                  if state != "APPROVED":
                      continue

                  if reviewer.lower() == pr_author.lower():
                      continue

                  association = (
                      review.get("author_association") or ""
                  ).upper()

                  if association not in trusted_associations:
                      continue

                  review_commit_id = review.get("commit_id") or ""
                  review_body = strip_comments(review.get("body") or "")

                  verdict_matches = re.findall(
                      r"^VERDICT:\s*(PASS|BLOCK|HOLD)\s*$",
                      review_body,
                      flags=re.M,
                  )

                  spec_matches = re.findall(
                      r"^SPEC:\s*#([1-9][0-9]*)\s+"
                      r"(v[1-9][0-9]*)\s*$",
                      review_body,
                      flags=re.M,
                  )

                  head_matches = re.findall(
                      r"^VERIFIED_HEAD:\s*"
                      r"([0-9a-fA-F]{40})\s*$",
                      review_body,
                      flags=re.M,
                  )

                  if len(verdict_matches) != 1:
                      continue

                  if len(spec_matches) != 1:
                      continue

                  if len(head_matches) != 1:
                      continue

                  verdict = verdict_matches[0]
                  review_spec_issue, review_spec_version = spec_matches[0]
                  verified_head = head_matches[0].lower()

                  if verdict != "PASS":
                      continue

                  if review_commit_id.lower() != head_sha.lower():
                      continue

                  if verified_head != head_sha.lower():
                      continue

                  if review_spec_issue != spec_issue:
                      continue

                  if review_spec_version != spec_version:
                      continue

                  valid_pass_reviews.append(
                      {
                          "reviewer": reviewer,
                          "review_id": review.get("id"),
                          "commit_id": review_commit_id,
                      }
                  )

              if not valid_pass_reviews:
                  fail(
                      "No valid independent verifier PASS review exists "
                      "for the current pull request head SHA and Spec."
                  )

          if errors:
              print("Verifier Gate: FAIL")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          evidence = valid_pass_reviews[-1]

          print("Verifier Gate: PASS")
          print(
              "Verified independent PASS evidence from reviewer "
              f"`{evidence['reviewer']}`."
          )
          print(f"Verified head SHA: {head_sha}")
          print(f"Spec: #{spec_issue} {spec_version}")
          PY
